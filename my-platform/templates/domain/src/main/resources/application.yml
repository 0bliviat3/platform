spring:
  application:
    name: __NAME__
  profiles:
    default: local
  config:
    # 로컬 .env 파일을 설정으로 읽는다. (없어도 시작된다. .env 는 커밋하지 않는다.)
    import: optional:file:./.env[.properties]
  # 실제 값은 환경변수(서버: env 파일, 로컬: .env)에서 받는다. 값이 없으면 dev/prod 에서는 시작되지 않는다.
  # local 프로필은 application-local.yml 의 가짜 값이 이 항목을 덮어쓴다.
  datasource:
    url: ${__NAME_UPPER___DB_URL}
    username: ${__NAME_UPPER___DB_USERNAME}
    password: ${__NAME_UPPER___DB_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: __PORT__
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis:
  mapper-locations: classpath:mapper/**/*.xml

wan:
  security:
    open: false
