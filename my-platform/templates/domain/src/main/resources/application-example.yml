# __NAME__ 설정 안내 (예시). 값은 이 저장소 어디에도 쓰지 않는다.
#
# application.yml 이 아래 환경변수 이름으로 값을 받는다. dev / prod 환경에 이 이름들을 모두 준비해야 앱이 시작된다.
#   서버: 서버의 env 파일(서비스·환경마다 1개, 저장소에 올리지 않음) -> 컨테이너 환경변수
#   로컬: 평소에는 필요 없다. (local 프로필은 application-local.yml 의 가짜 값을 쓴다)
#         로컬에서 dev 환경에 붙을 때만 .env 에 `이름=값` 형식으로 쓰고 Active profiles 를 dev 로 지정한다. (.gitignore 대상)
#
# 필요한 환경변수 이름 (값 없음)
#   __NAME_UPPER___DB_URL         DB 접속 주소
#   __NAME_UPPER___DB_USERNAME    DB 계정
#   __NAME_UPPER___DB_PASSWORD    DB 비밀번호
#
# 서비스에 설정이 추가되면 application.yml 에 ${환경변수} 로 쓰고, 이 목록에도 이름을 추가한다.
